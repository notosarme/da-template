<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/main.css" />
  <title>Gallery</title>
</head>
<body id="gallery">
  <div class="grid">
  <header class="header container">
    <h1>DeviantArt Template</h1>
      <nav>
          <ul>
              <li><a href="/">Home</a></li>
              <li><a href="/gallery">Gallery</a></li>
              <li><a href="/posts">Posts</a></li>
              <li><a href="/about">About</a></li>
          </ul>
      </nav>
    </header>

      <aside class="left flex-column container gallery-sidebar">
    <h2>Gallery Folders</h2>
    <ul class="category-list">
  
    <li>
      <a href="/gallery/commissions/">
        <div class="category-card">
          <img src="/assets/artwork/splatoon/coordinated_attack.jpg" alt="commissions">
          <div class="tag">Commissions</div>
        </div>
      </a>
    </li>
  
    <li>
      <a href="/gallery/original/">
        <div class="category-card">
          <img src="/assets/artwork/original/manila_paints.png" alt="original">
          <div class="tag">Original</div>
        </div>
      </a>
    </li>
  
    <li>
      <a href="/gallery/pokemon/">
        <div class="category-card">
          <img src="/assets/artwork/pokemon/usum_redraw.jpg" alt="pokemon">
          <div class="tag">Pokemon</div>
        </div>
      </a>
    </li>
  
    <li>
      <a href="/gallery/splatoon/">
        <div class="category-card">
          <img src="/assets/artwork/splatoon/coordinated_attack.jpg" alt="splatoon">
          <div class="tag">Splatoon</div>
        </div>
      </a>
    </li>
  
</ul>

  </aside>
  
  <main class="right container">
    <div class="gallery">
      
  <div class="gallery-card">
    <a href="/art/coordinated_attack/">
      <figure>
          <img src="/assets/artwork/splatoon/coordinated_attack.jpg">

      </figure>

  </div>

  <div class="gallery-card">
    <a href="/art/usum_redraw/">

          <img src="/assets/artwork/pokemon/usum_redraw.jpg">

  </div>

  <div class="gallery-card">
    <a href="/art/my_dear/">
      <figure>
          <img src="/assets/artwork/splatoon/my_dear.jpg">
          <figcaption>my dear</figcaption>
      </figure>
    </a>
  </div>

  <div class="gallery-card">
    <a href="/art/manila_paints/">
      <figure>
          <img src="/assets/artwork/original/manila_paints.png">

  <div class="gallery-card">
    <a href="/art/pro_memoria_2024/">

    <a href="/art/takie_and_gwan/">

  <div class="gallery-card">
